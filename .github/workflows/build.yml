# Builds the APKs on GitHub and runs core's unit tests. Nothing here talks to the app's users or data:
# original/ is not in the repository, so the real-file round trip tests skip themselves.
name: Build APKs

on:
  push:
    branches: [main, master, customization]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with the same debug key as the PC, so these APKs install over the one on the phone and keep its data.
      # Add the secret DEBUG_KEYSTORE_BASE64 (base64 of ~/.android/debug.keystore) under Settings, Secrets and variables, Actions.
      # Without it the APKs are signed with a throwaway key and need an uninstall (which deletes data) before they install.
      - name: Debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: clean-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
